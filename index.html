<style>
  @font-face {
    font-family: 'Lilita One';
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url('vendor/fonts/lilita-one.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Nunito';
    font-style: normal;
    font-weight: 200 1000;
    font-display: swap;
    src: url('vendor/fonts/nunito-variable.woff2') format('woff2');
  }
  html, body { height:100%; margin:0; background:#0b1238; }
  #root { height:100%; display:flex; }
  body {
    font-family:'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-weight: 800;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  button { font-family: inherit; font-weight: 800; }
</style>
</head>
<body>

<div id="root"></div>

<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<script src="bundle.js?v=1.25.0"></script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(function(reg){
      if (reg && typeof reg.update === 'function') reg.update().catch(function(){});
    }).catch(function(){});
  }
  function enterFullscreen() {
    try {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
      if (fn) fn.call(el).catch(function(){});
    } catch (_) {}
  }
  document.addEventListener('touchstart', enterFullscreen, { once: true, passive: true });
  document.addEventListener('click', enterFullscreen, { once: true });
</script>

</body>
